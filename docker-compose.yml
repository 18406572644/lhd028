version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: blindbox-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: cinema_blindbox
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blindbox-backend
    ports:
      - "6028:6028"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cinema_blindbox?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blindbox-frontend
    ports:
      - "2028:2028"
    depends_on:
      - backend

  # server:
  #   build:
  #     context: ./server
  #     dockerfile: Dockerfile
  #   container_name: blindbox-server
  #   ports:
  #     - "4028:4028"
  #   depends_on:
  #     - backend

volumes:
  mysql_data:
  uploads_data:
